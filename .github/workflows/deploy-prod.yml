name: Plan/Deploy Production (infra-k8s)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar?"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - deploy
      deploy_prod:
        description: "Confirma deploy em produção? (obrigatório para 'deploy')"
        required: true
        default: false
        type: boolean
      apply_k8s:
        description: "Aplicar manifests Kubernetes (addons + base)? (apenas deploy)"
        required: true
        default: true
        type: boolean
      ns:
        description: "Namespace/pessoa (ex: grupo19)"
        required: true
        default: "grupo19"
        type: string

jobs:
  prod:
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_DIR: terraform
      STATE_PREFIX: state
      REPO: infra-k8s

    steps:
      - uses: actions/checkout@v4

      - name: Safety check (deploy)
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        run: |
          if [ "${{ inputs.deploy_prod }}" != "true" ]; then
            echo "deploy_prod=false → abortando deploy"
            exit 0
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve tfvars + env/region/project + state key
        id: env
        shell: bash
        working-directory: terraform
        run: |
          set -euo pipefail

          # escolhe tfvars existente
          if [ -f terraform.tfvars.prod ]; then
            TFVARS="terraform.tfvars.prod"
          elif [ -f terraform.tfvars ]; then
            TFVARS="terraform.tfvars"
          elif [ -f terraform.tfvars.example ]; then
            TFVARS="terraform.tfvars.example"
          else
            echo "ERROR: no tfvars found (terraform.tfvars.prod / terraform.tfvars / terraform.tfvars.example)."
            exit 1
          fi

          # extrai project/env/region do tfvars
          get_tfvar() {
            local key="$1"
            sed -nE 's/^\s*'"$key"'\s*=\s*"([^"]+)".*$/\1/p' "$TFVARS" | head -n1
          }

          PROJECT_NAME="$(get_tfvar project_name)"
          ENVIRONMENT="$(get_tfvar environment)"
          AWS_REGION_TFV="$(get_tfvar aws_region)"

          if [ -z "${PROJECT_NAME}" ] || [ -z "${ENVIRONMENT}" ] || [ -z "${AWS_REGION_TFV}" ]; then
            echo "ERROR: Could not parse project_name/environment/aws_region from ${TFVARS}."
            exit 1
          fi

          NS="${{ inputs.ns }}"
          STATE_KEY="${{ env.STATE_PREFIX }}/${{ env.REPO }}/${ENVIRONMENT}/${NS}/terraform.tfstate"

          echo "tfvars=$TFVARS" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "aws_region=$AWS_REGION_TFV" >> "$GITHUB_OUTPUT"
          echo "ns=$NS" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"

      - name: Discover backend (bucket + lock table) via AWS (no bootstrap state needed)
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.env.outputs.project_name }}"
          ENVIRONMENT="${{ steps.env.outputs.environment }}"
          REGION="${{ steps.env.outputs.aws_region }}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          # seu padrão real tem sufixo aleatório:
          # tech-challenge-tfstate-<account>-<region>-<env>-<suffix>
          PREFIX="${PROJECT}-tfstate-${ACCOUNT_ID}-${REGION}-${ENVIRONMENT}-"

          BUCKET="$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, \`${PREFIX}\`)].Name | sort(@) | [-1]" \
            --output text)"

          if [ -z "${BUCKET}" ] || [ "${BUCKET}" = "None" ]; then
            echo "ERROR: Não achei bucket de state com prefixo: ${PREFIX}"
            echo "Buckets existentes com prefixo próximo:"
            aws s3api list-buckets --query "Buckets[].Name" --output text | tr '\t' '\n' | grep -E "${PROJECT}-tfstate-${ACCOUNT_ID}-${REGION}-${ENVIRONMENT}" || true
            echo ""
            echo "Opções:"
            echo "  1) Rodar o bootstrap uma vez (local) e garantir que criou bucket"
            echo "  2) Remover sufixo aleatório no bootstrap (bucket determinístico) e recriar"
            exit 1
          fi

          LOCK_TABLE="${PROJECT}-terraform-locks-${ACCOUNT_ID}-${REGION}-${ENVIRONMENT}"

          {
            echo "bucket=${BUCKET}"
            echo "lock_table=${LOCK_TABLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Terraform init (remote backend)
        shell: bash
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${{ steps.env.outputs.state_key }}" \
            -backend-config="region=${{ steps.env.outputs.aws_region }}" \
            -backend-config="dynamodb_table=${{ steps.backend.outputs.lock_table }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        shell: bash
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform plan (gera arquivo + texto)
        id: plan
        shell: bash
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform plan \
            -var-file="${{ steps.env.outputs.tfvars }}" \
            -input=false \
            -no-color \
            -out=tfplan

          terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.env.outputs.environment }}-${{ steps.env.outputs.ns }}-${{ env.REPO }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt

      - name: Terraform apply (deploy)
        if: ${{ inputs.action == 'deploy' }}
        shell: bash
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform apply \
            -var-file="${{ steps.env.outputs.tfvars }}" \
            -input=false \
            -auto-approve \
            -no-color

      - name: Install kubectl
        if: ${{ inputs.action == 'deploy' && inputs.apply_k8s == true }}
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup kubeconfig
        if: ${{ inputs.action == 'deploy' && inputs.apply_k8s == true }}
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_NAME="$(terraform -chdir=terraform output -raw eks_cluster_name 2>/dev/null || true)"
          if [ -z "${CLUSTER_NAME}" ]; then
            echo "ERROR: Terraform output 'eks_cluster_name' not found."
            exit 1
          fi
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${{ steps.env.outputs.aws_region }}"
          kubectl get nodes

      - name: Apply addons
        if: ${{ inputs.action == 'deploy' && inputs.apply_k8s == true }}
        run: kubectl apply -k k8s/addons
