name: Destroy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-prod" to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: terraform

    env:
      BACKEND_KEY: env/prod/terraform.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rodar fora do working-directory default (terraform)
      - name: Safety check (manual confirmation)
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "destroy-prod" ]; then
            echo "Confirmation failed. You must type: destroy-prod"
            exit 1
          fi

      - name: Debug structure (repo + terraform dir)
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          echo "Repo root:"
          ls -la
          echo ""
          echo "Terraform dir:"
          if [ ! -d terraform ]; then
            echo "ERROR: terraform/ directory not found at repo root."
            exit 1
          fi
          ls -la terraform
          echo ""
          echo "tfvars candidates under terraform/:"
          find terraform -maxdepth 3 -type f -name "*.tfvars*" -o -name "*.tfvars" | sed 's|^| - |' || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Pick tfvars (prod)
        id: tfvars
        shell: bash
        run: |
          set -euo pipefail

          # Estamos dentro de terraform/ por causa do defaults.run.working-directory
          CANDIDATES=(
            "terraform.tfvars.prod"
            "terraform.tfvars"
            "terraform.tfvars.example"
            "env/prod/terraform.tfvars"
            "env/prod/terraform.tfvars.prod"
            "vars/prod.tfvars"
            "vars/production.tfvars"
          )

          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              echo "Using tfvars: $f"
              echo "file=$f" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "ERROR: terraform.tfvars.prod (preferred) or other tfvars not found in terraform/."
          echo "Searched:"
          printf ' - %s\n' "${CANDIDATES[@]}"
          exit 1

      - name: Validate tfvars are PRODUCTION
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tfv="${{ steps.tfvars.outputs.file }}"

          get_tfvar() {
            local key="$1"
            sed -nE 's/^\s*'"$key"'\s*=\s*"([^"]+)".*$/\1/p' "$tfv" | head -n1
          }

          PROJECT_NAME="$(get_tfvar project_name)"
          ENVIRONMENT="$(get_tfvar environment)"
          AWS_REGION_TFV="$(get_tfvar aws_region)"

          if [ -z "${PROJECT_NAME}" ] || [ -z "${ENVIRONMENT}" ] || [ -z "${AWS_REGION_TFV}" ]; then
            echo "ERROR: Could not parse project_name/environment/aws_region from ${tfv}."
            echo "Make sure they exist and are quoted, e.g.:"
            echo 'project_name = "myproj"'
            echo 'environment  = "prod"'
            echo 'aws_region   = "us-east-1"'
            exit 1
          fi

          # trava extra: só deixa destruir se for prod/production
          if [ "${ENVIRONMENT}" != "prod" ] && [ "${ENVIRONMENT}" != "production" ]; then
            echo "ERROR: environment in ${tfv} is '${ENVIRONMENT}', expected 'prod' or 'production'."
            exit 1
          fi

          # aviso se cair no example (não bloqueia, mas deixa explícito no log)
          if [[ "$tfv" == *".example" ]]; then
            echo "WARNING: Using a .example tfvars file for production destroy. Ensure values are REAL."
          fi

          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "aws_region=$AWS_REGION_TFV" >> "$GITHUB_OUTPUT"

      - name: Ensure remote backend bucket exists (S3)
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_NAME="${{ steps.validate.outputs.project_name }}"
          ENVIRONMENT="${{ steps.validate.outputs.environment }}"
          AWS_REGION_TFV="${{ steps.validate.outputs.aws_region }}"

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="${PROJECT_NAME}-tfstate-${ACCOUNT_ID}-${AWS_REGION_TFV}-${ENVIRONMENT}"

          echo "Checking backend bucket: $BUCKET (region: $AWS_REGION_TFV)"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "ERROR: backend bucket does not exist (or no access): $BUCKET"
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "region=$AWS_REGION_TFV" >> "$GITHUB_OUTPUT"

      - name: Terraform init (remote backend)
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=${{ env.BACKEND_KEY }}" \
            -backend-config="region=${{ steps.backend.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan (destroy preview)
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -destroy \
            -var-file="${{ steps.tfvars.outputs.file }}" \
            -input=false -no-color

      - name: Terraform destroy (production)
        shell: bash
        run: |
          set -euo pipefail
          terraform destroy \
            -var-file="${{ steps.tfvars.outputs.file }}" \
            -input=false -auto-approve -no-color
