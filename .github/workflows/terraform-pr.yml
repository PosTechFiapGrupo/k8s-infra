name: Terraform PR

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure remote backend (S3 bucket + DynamoDB locks)
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          # --- 1) Lê vars básicas do terraform.tfvars (formato: key = "value") ---
          tfv="terraform.tfvars"
          if [ ! -f "$tfv" ]; then
            echo "ERROR: terraform.tfvars not found in $(pwd)."
            exit 1
          fi

          get_tfvar() {
            local key="$1"
            # pega a primeira ocorrência: key = "value"  (ignora comentários)
            sed -nE 's/^\s*'"$key"'\s*=\s*"([^"]+)".*$/\1/p' "$tfv" | head -n1
          }

          PROJECT_NAME="$(get_tfvar project_name)"
          ENVIRONMENT="$(get_tfvar environment)"
          AWS_REGION_TFV="$(get_tfvar aws_region)"

          if [ -z "${PROJECT_NAME}" ] || [ -z "${ENVIRONMENT}" ] || [ -z "${AWS_REGION_TFV}" ]; then
            echo "ERROR: Could not parse project_name/environment/aws_region from terraform.tfvars."
            echo "Make sure terraform.tfvars contains:"
            echo '  project_name = "..."'
            echo '  environment  = "..."'
            echo '  aws_region   = "..."'
            exit 1
          fi

          # --- 2) Conta AWS (para garantir unicidade do bucket) ---
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

          # --- 3) Nomes determinísticos (CI-friendly) ---
          BUCKET="${PROJECT_NAME}-tfstate-${ACCOUNT_ID}-${AWS_REGION_TFV}-${ENVIRONMENT}"
          TABLE="${PROJECT_NAME}-terraform-locks-${ACCOUNT_ID}-${AWS_REGION_TFV}-${ENVIRONMENT}"

          echo "Resolved backend:"
          echo "  bucket=$BUCKET"
          echo "  table=$TABLE"
          echo "  region=$AWS_REGION_TFV"

          # --- 4) Bucket: cria se não existir ---
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "S3 bucket exists: $BUCKET"
          else
            echo "Creating S3 bucket: $BUCKET"
            if [ "$AWS_REGION_TFV" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION_TFV"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$AWS_REGION_TFV" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION_TFV"
            fi

            # boas práticas (equivalente ao seu bootstrap)
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          # --- 5) DynamoDB lock table: cria se não existir ---
          if aws dynamodb describe-table --table-name "$TABLE" --region "$AWS_REGION_TFV" >/dev/null 2>&1; then
            echo "DynamoDB table exists: $TABLE"
          else
            echo "Creating DynamoDB table: $TABLE"
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION_TFV"

            aws dynamodb wait table-exists --table-name "$TABLE" --region "$AWS_REGION_TFV"
          fi

          # outputs p/ próximos steps
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "table=$TABLE" >> "$GITHUB_OUTPUT"
          echo "region=$AWS_REGION_TFV" >> "$GITHUB_OUTPUT"

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=env/dev/terraform.tfstate" \
            -backend-config="region=${{ steps.backend.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=terraform.tfvars -input=false -no-color
