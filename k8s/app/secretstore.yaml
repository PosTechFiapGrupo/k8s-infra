apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # ajustar conforme a pessoa 1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: app
