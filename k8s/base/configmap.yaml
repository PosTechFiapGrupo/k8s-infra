# =============================================================================
# ConfigMap - Tech Challenge
# =============================================================================
# Configurações NÃO sensíveis da aplicação
# Dados de banco (host, user, password, port, name) vêm do Secret

apiVersion: v1
kind: ConfigMap
metadata:
  name: tech-challenge-config
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: config
data:
  # ---------------------------------------------------------------------------
  # Configurações da Aplicação
  # ---------------------------------------------------------------------------
  APP_NAME: "tech-challenge"
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # ---------------------------------------------------------------------------
  # Configurações do Servidor
  # ---------------------------------------------------------------------------
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"

  # ---------------------------------------------------------------------------
  # Configurações do Banco (NÃO sensíveis)
  # OBS:
  # - DB_HOST, DB_PORT, DB_NAME, DB_USER e DB_PASSWORD
  #   vêm do Secret (External Secrets / Secrets Manager)
  # ---------------------------------------------------------------------------
  DB_DRIVER: "mysql+asyncmy"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"

  # ---------------------------------------------------------------------------
  # Configurações de Autenticação JWT
  # ---------------------------------------------------------------------------
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"

  # ---------------------------------------------------------------------------
  # Configurações de CORS
  # ---------------------------------------------------------------------------
  CORS_ORIGINS: "*"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  CORS_ALLOW_HEADERS: "*"

  # ---------------------------------------------------------------------------
  # Configurações de Rate Limiting
  # ---------------------------------------------------------------------------
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"

  # ---------------------------------------------------------------------------
  # Timezone
  # ---------------------------------------------------------------------------
  TZ: "America/Sao_Paulo"

  # ---------------------------------------------------------------------------
  # Observabilidade / Tracing
  # ---------------------------------------------------------------------------
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "tech-challenge-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
