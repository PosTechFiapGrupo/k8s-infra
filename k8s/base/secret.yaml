# =============================================================================
# Secret - Tech Challenge (Template Vazio)
# =============================================================================
# ATENÇÃO: Este arquivo é um modelo. Os valores devem ser preenchidos
# com base64 encoded strings antes de aplicar em produção.
#
# Para gerar valores em base64:
#   echo -n "seu_valor" | base64
#
# IMPORTANTE: Nunca commite secrets reais no repositório!
# Use ferramentas como:
# - AWS Secrets Manager
# - HashiCorp Vault
# - Sealed Secrets
# - External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: tech-challenge-secrets
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: secrets
  annotations:
    description: "Secrets sensíveis da aplicação - NÃO COMMITAR VALORES REAIS"
type: Opaque
data:
  # =====================================================
  # BANCO DE DADOS
  # =====================================================
  # NOTA: Substitua pelos valores reais em base64
  
  # Username do banco de dados
  # echo -n "tech_user" | base64
  DB_USER: ""
  
  # Senha do banco de dados
  # echo -n "sua_senha_segura" | base64
  DB_PASSWORD: ""
  
  # Senha root do MySQL (se necessário)
  # echo -n "sua_senha_root" | base64
  MYSQL_ROOT_PASSWORD: ""

  # =====================================================
  # AUTENTICAÇÃO JWT
  # =====================================================
  
  # Secret key para tokens JWT
  # Gere com: python -c "import secrets; print(secrets.token_hex(32))"
  # echo -n "seu_secret_key" | base64
  SECRET_KEY: ""

  # =====================================================
  # AWS (se necessário)
  # =====================================================
  
  # AWS Access Key (preferir IRSA ao invés de credenciais estáticas)
  # AWS_ACCESS_KEY_ID: ""
  
  # AWS Secret Access Key
  # AWS_SECRET_ACCESS_KEY: ""

  # =====================================================
  # INTEGRAÇÕES EXTERNAS
  # =====================================================
  
  # API Keys para serviços externos
  # EXTERNAL_API_KEY: ""
  
  # Webhooks secrets
  # WEBHOOK_SECRET: ""

---
# =============================================================================
# Secret - Docker Registry (para pull de imagens privadas)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ghcr-registry-secret
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: registry
type: kubernetes.io/dockerconfigjson
data:
  # NOTA: Gere o .dockerconfigjson com:
  # kubectl create secret docker-registry ghcr-registry-secret \
  #   --docker-server=ghcr.io \
  #   --docker-username=<github-username> \
  #   --docker-password=<github-pat> \
  #   --docker-email=<email> \
  #   --namespace=tech-challenge \
  #   --dry-run=client -o yaml
  .dockerconfigjson: ""

---
# =============================================================================
# Secret - TLS Certificate (para HTTPS - se necessário)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: tech-challenge
  labels:
    app: tech-challenge
    component: tls
type: kubernetes.io/tls
data:
  # NOTA: Use cert-manager para gerenciar certificados automaticamente
  # ou preencha com certificados válidos em base64
  tls.crt: ""
  tls.key: ""
