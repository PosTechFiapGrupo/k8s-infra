# =============================================================================
# ServiceAccount - Tech Challenge
# =============================================================================
# Service Account para a aplicação com IRSA (IAM Roles for Service Accounts)

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tech-challenge-sa
  namespace: tech-challenge
  labels:
    app: tech-challenge
  annotations:
    # NOTA: Substitua pelo ARN real da IAM Role criada pelo Terraform
    # Este annotation habilita IRSA para acesso a recursos AWS
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/tech-challenge-dev-eks-secrets-manager-role"
automountServiceAccountToken: true

---
# =============================================================================
# Role - Tech Challenge (RBAC)
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tech-challenge-role
  namespace: tech-challenge
  labels:
    app: tech-challenge
rules:
  # Permite ler ConfigMaps e Secrets no namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  
  # Permite ler informações de pods (útil para debugging)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  
  # Permite ler informações de services
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
# =============================================================================
# RoleBinding - Tech Challenge
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tech-challenge-rolebinding
  namespace: tech-challenge
  labels:
    app: tech-challenge
subjects:
  - kind: ServiceAccount
    name: tech-challenge-sa
    namespace: tech-challenge
roleRef:
  kind: Role
  name: tech-challenge-role
  apiGroup: rbac.authorization.k8s.io
